name: .NET Core Desktop Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write # necessario per creare la Release su GitHub

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      Project_Path: FormatoFogliSpesa/FormatoFogliSpesa.csproj
      App_Name: FormatoFogliSpesa
      Configuration: Release

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore ${{ env.Project_Path }}

    - name: Publish (self-contained, win-x64)
      run: >
        dotnet publish ${{ env.Project_Path }}
        --configuration ${{ env.Configuration }}
        --runtime win-x64
        --self-contained true
        --no-restore
        --output publish

    - name: Create zip
      shell: pwsh
      run: Compress-Archive -Path publish\* -DestinationPath "${{ env.App_Name }}-win-x64.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.App_Name }}-win-x64
        path: ${{ env.App_Name }}-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        generate_release_notes: true
        files: ${{ env.App_Name }}-win-x64.zip
